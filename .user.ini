; PHP-Einstellungen fuer den Forums-Docroot (greift ueber PHP-FPM, kein Neustart
; noetig — user_ini.cache_ttl = 300s).
;
; Hintergrund (19.08.2026): Beim Passwort-Reset stand eine "[phpBB Debug] PHP
; Warning" oben im Browser. Der phpBB-Debugmodus war NICHT an — phpBB gibt
; E_NOTICE und E_WARNING in includes/functions.php (msg_handler, ~Zeile 3066)
; selbst per echo aus, sobald der Fehler in error_reporting() enthalten ist.
; display_errors wird dabei umgangen, die einzige Stellschraube ist also
; error_reporting.
;
; Nur E_WARNING und E_NOTICE sind ausgenommen — genau die beiden Zweige, die
; msg_handler ins HTML schreibt. Fatals, Parse-Errors und E_USER_ERROR bleiben
; bewusst aktiv, sonst verschluckt man echte Ausfaelle.
;
; Die Datei ist nicht abrufbar: deny-dotfiles.inc sperrt alles mit fuehrendem
; Punkt in jedem Server-Block.
error_reporting = E_ALL & ~E_WARNING & ~E_NOTICE & ~E_DEPRECATED & ~E_USER_DEPRECATED
display_errors = Off
